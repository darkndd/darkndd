name: Metrics
on:
  # Se ejecuta automáticamente cada noche a las 00:00
  schedule: [{cron: "0 0 * * *"}]
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta cuando haces un cambio en tu README
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Usamos el token que creaste
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Configuraciones visuales básicas
          user: darkndd
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Madrid
